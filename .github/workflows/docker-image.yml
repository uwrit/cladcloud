name: Build Docker Images

on:
  pull_request:
    branches:
    - "main"
  push:
    branches:
    - "main"
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.ref_name }}

env:
  # dynamic doesn't work here, only static data
  REPOSITORY:
  TIGER_DOMAIN: clad-github-builder.rit.uw.edu
  YEAR: 2024

jobs:

  build-num:
    runs-on: self-hosted
    outputs:
      BUILD_NUM: ${{ steps.build_num.outputs.BUILD_NUM }}

    steps:
    - name: export BUILD_NUM to env
      id: build_num
      run: echo "BUILD_NUM=$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

  build-degauss:
    runs-on: self-hosted
    needs: build-num

    steps:
    - uses: actions/checkout@v5
    - name: import build_num
      run: echo "BUILD_NUM=${{ needs.build-num.outputs.BUILD_NUM }}" >> "$GITHUB_ENV"
    - name: print env
      run: env | sort
    - name: Build the degauss image
      run: docker build --cpu-quota $(( $(nproc --all)*100000 )) degauss --tag degauss-build:${{ env.BUILD_NUM }}
    - name: flatten out the docker layers
      run: docker export $(docker create degauss-build:${{ env.BUILD_NUM }} /bin/bash) | docker import - degauss-flat:${{ env.BUILD_NUM }}
    - name: export the flattened image
      run: |
        cat << 'EOF' > /dev/shm/degauss-${{ env.BUILD_NUM }}.dockerfile
        FROM degauss-flat:${{ env.BUILD_NUM }} AS degauss

        # DeGAUSS container metadata
        ENV degauss_name="geocoder" \
            degauss_version="3.4.0" \
            degauss_description="geocodes" \
            degauss_argument="valid_geocode_score_threshold [default: 0.5]"

        # add OCI labels based on environment variables too
        LABEL "org.degauss.name"="${degauss_name}" \
            "org.degauss.version"="${degauss_version}" \
            "org.degauss.description"="${degauss_description}" \
            "org.degauss.argument"="${degauss_argument}"

        # Foundry customizations
        USER 5001
        ENV SHARED_DIR=/opt/palantir/sidecars/shared-volumes/shared
        WORKDIR /opt/palantir/sidecars/shared-volumes/shared/
        ENTRYPOINT ["entrypoint", "-c", "/app/geocode /opt/palantir/sidecars/shared-volumes/shared/infile.csv"]
        EOF
        docker build --output type=image,compression=zstd,compression-level=9 --platform linux/amd64 -f /dev/shm/degauss-${{ env.BUILD_NUM }}.dockerfile degauss --tag genoa-container-registry.washington.palantircloud.com/degauss:${{ env.BUILD_NUM }}
    - name: test container
      run: cp test/* /dev/shm/ && docker run --rm -v "/dev/shm":/opt/palantir/sidecars/shared-volumes/shared --entrypoint /app/geocode genoa-container-registry.washington.palantircloud.com/degauss:${{ env.BUILD_NUM }} /opt/palantir/sidecars/shared-volumes/shared/infile.csv all
    - name: Run Trivy CVE vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: genoa-container-registry.washington.palantircloud.com/degauss:${{ env.BUILD_NUM }}
        version: v0.75.0
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        timeout: '1h'
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH,MEDIUM'
    - name: Run Grype CVE vulnerability scanner
      uses: anchore/scan-action@v7
      id: grype-scan
      if: always()
      env:
        GRYPE_DB_CACHE_DIR: /dev/shm/
      with:
        image: genoa-container-registry.washington.palantircloud.com/degauss:${{ env.BUILD_NUM }}
        grype-version: v0.120.0
        cache-db: true
        only-fixed: true
        fail-build: true
        output-format: json
    - name: Dump Grype Results
      if: failure()
      run: |
        cat ${{ steps.grype-scan.outputs.json }} | \
        jq -r '["NAME", "INSTALLED", "VULNERABILITY", "SEVERITY", "FIXED IN"],
               ((.matches[]?, .ignoredMatches[]?) |
               [.artifact.name, .artifact.version, .vulnerability.id, .vulnerability.severity, .matchDetails[0].found.versionConstraint]) | @tsv' | \
        column -t -s $'\t'

  setup-postgis-states:
    runs-on: self-hosted
    needs: build-num
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}

    steps:
    - id: matrix
      run: echo 'value=["ak", "al", "ar", "as", "az", "ca", "co", "ct", "dc", "de", "fl", "fm", "ga", "gu", "hi", "ia", "id", "il", "in", "ks", "ky", "la", "ma", "md", "me", "mh", "mi", "mn", "mo", "ms", "mt", "nc", "nd", "ne", "nh", "nj", "nm", "nv", "ny", "oh", "ok", "or", "pa", "pr", "pw", "ri", "sc", "sd", "tn", "tx", "ut", "va", "vi", "vt", "wa", "wi", "wv", "wy"]' >> $GITHUB_OUTPUT
    - run: echo "${{ steps.matrix.outputs.value }}"

  build-postgis-states:
    runs-on: self-hosted
    needs: [build-num, setup-postgis-states]
    continue-on-error: true
    strategy:
      matrix:
        value: ${{fromJSON(needs.setup-postgis-states.outputs.matrix)}}

    steps:
    - uses: actions/checkout@v5
    - name: import build_num
      run: echo "BUILD_NUM=${{ needs.build-num.outputs.BUILD_NUM }}" >> "$GITHUB_ENV"
    - name: print env
      run: env | sort
    - name: Build the postgis image
      run: docker build --output type=image,compression=zstd,compression-level=9,oci-mediatypes=true,sbom=false --shm-size 4g --cpu-quota $(( $(nproc --all)*100000 )) --build-arg TIGER_DOMAIN=${{ env.TIGER_DOMAIN }} --build-arg YEAR=${{ env.YEAR }} --build-arg state_var=${{ matrix.value }} uwpostgis --platform linux/amd64 --tag genoa-container-registry.washington.palantircloud.com/postgis-${{ matrix.value }}:${{ env.BUILD_NUM }}
    - name: test container
      run: cp test/* /dev/shm/ && docker run --rm -v "/dev/shm":/opt/palantir/sidecars/shared-volumes/shared --entrypoint /app/geocode genoa-container-registry.washington.palantircloud.com/postgis-${{ matrix.value }}:${{ env.BUILD_NUM }} /opt/palantir/sidecars/shared-volumes/shared/infile.csv
    - name: Run Trivy CVE vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      env:
        TRIVY_SKIP_DB_UPDATE: true
        TRIVY_SKIP_JAVA_DB_UPDATE: true
      with:
        image-ref: genoa-container-registry.washington.palantircloud.com/postgis-${{ matrix.value }}:${{ env.BUILD_NUM }}
        version: v0.75.0
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        timeout: '1h'
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH,MEDIUM'
    - name: Run Grype CVE vulnerability scanner
      uses: anchore/scan-action@v7
      id: grype-scan
      if: always()
      env:
        GRYPE_DB_CACHE_DIR: /dev/shm/
        GRYPE_DB_AUTO_UPDATE: false
      with:
        image: genoa-container-registry.washington.palantircloud.com/postgis-${{ matrix.value }}:${{ env.BUILD_NUM }}
        grype-version: v0.120.0
        cache-db: true
        only-fixed: true
        fail-build: true
        output-format: json
    - name: Dump Grype Results
      if: failure()
      run: |
        cat ${{ steps.grype-scan.outputs.json }} | \
        jq -r '["NAME", "INSTALLED", "VULNERABILITY", "SEVERITY", "FIXED IN"],
               ((.matches[]?, .ignoredMatches[]?) |
               [.artifact.name, .artifact.version, .vulnerability.id, .vulnerability.severity, .matchDetails[0].found.versionConstraint]) | @tsv' | \
        column -t -s $'\t'
